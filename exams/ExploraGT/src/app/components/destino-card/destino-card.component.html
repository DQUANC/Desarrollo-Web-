<article class="card" [class.card--destacado]="destino.destacado">
  <div class="card__image-wrap">
    <img
      [src]="destino.imagenUrl"
      [alt]="'Fotografía de ' + destino.nombre"
      class="card__image"
      loading="lazy"
    />
    <span class="badge badge--categoria" [attr.data-cat]="destino.categoria">
      {{ destino.categoria }}
    </span>
    @if (destino.destacado) {
      <span class="badge badge--destacado">⭐ Destacado</span>
    }
  </div>

  <div class="card__body">
    <h3 class="card__title">{{ destino.nombre }}</h3>
    <p class="card__location">
      <span aria-hidden="true">📍</span>
      {{ destino.ubicacion }}, Guatemala
    </p>
    <p class="card__desc">{{ destino.descripcion }}</p>

    <div class="card__stars" [attr.aria-label]="destino.calificacion + ' de 5 estrellas'">
      @for (filled of stars; track $index) {
        <span class="star" [class.star--filled]="filled">★</span>
      }
      <span class="card__rating">{{ destino.calificacion }}/5</span>
    </div>
  </div>
</article>
